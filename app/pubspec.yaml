name: eventivo
description: "EVENTIVO — Sistema de seguimiento de eventos académicos UCV campus Callao (app Flutter MVVM)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI / navegación
  cupertino_icons: ^1.0.8

  # Estado (MVVM): Riverpod + GoRouter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Red
  dio: ^5.7.0

  # Tokens seguros (Keystore/Keychain)
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true