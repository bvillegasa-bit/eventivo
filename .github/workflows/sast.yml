name: sast

# Análisis estático de seguridad (T-S1.04): CodeQL + Semgrep.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analizar
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  semgrep:
    name: Semgrep (auto, severidad ERROR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep
        uses: docker://returntocorp/semgrep:latest
        with:
          # p/security-audit = ruleset comunitario de seguridad (T-S1.04).
          # --config auto exige métricas activadas; con --metrics=off se usa
          # un config explícito. --error rompe CI ante hallazgos de severidad ERROR.
          args: semgrep --config p/security-audit --severity ERROR --error --metrics=off .