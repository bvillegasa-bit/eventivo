# EVENTIVO — servidor del gateway (T-S1.14, DT-02)
#
# Rutas por servicio para la app móvil. Reglas generales:
#   * /internal/*  -> bloqueado SIEMPRE hacia el exterior (403). La red interna
#                     entre servicios usa X-Service-Key y no pasa por aquí.
#   * /auth/*      -> proxy al auth-service (misma política en producción).
#   * 404 por defecto (sin "welcome page" de Nginx).

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # ---- encabezados de seguridad --------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS solo tiene sentido sobre HTTPS; se activa en producción (free tier).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- red interna (DT-02) -------------------------------------------------
    # Nunca se proxea: /internal/* es exclusivo de la comunicación servicio↔servicio.
    location ^~ /internal/ {
        return 403;
    }

    # ---- healthcheck del propio gateway --------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ---- auth-service: reglas generales ---------------------------------------
    location /auth/ {
        limit_req zone=api_global burst=40 nodelay;

        proxy_pass http://auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # ---- auth-service: login con límite más estricto (5 r/s por IP) -----------
    # Devuelve 429 (limit_req_status) antes de llegar al servicio.
    location = /auth/login {
        limit_req zone=login burst=10 nodelay;

        proxy_pass http://auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # ---- cualquier otra ruta ---------------------------------------------------
    location / {
        return 404;
    }
}