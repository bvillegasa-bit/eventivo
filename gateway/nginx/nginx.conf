# EVENTIVO — API Gateway (Nginx) — T-S1.14 (Batch 2)
#
# Punto único de entrada de la app móvil (DT-02). En desarrollo escucha en :80
# publicado como :8080 en docker-compose.dev.yml; en producción se termina TLS
# (HTTPS) en este mismo Nginx o en el balanceador del free tier.
#
# Estructura:
#   nginx.conf       -> configuración principal (http, límites, upstreams)
#   conf.d/*.conf    -> servidores y rutas por servicio
#
# En docker-compose.dev.yml se montan ambos archivos sobre la imagen
# nginx:1.27-alpine (read-only); "auth" se resuelve vía la red del compose.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # No revelar la versión de Nginx en respuestas ni páginas de error.
    server_tokens      off;

    # ---- límites de peticiones (por IP) --------------------------------------
    # global: 20 req/s sostenidos; login: 5 req/s (complementa el rate-limit
    # del auth-service, que responde 429 con Retry-After).
    limit_req_zone  $binary_remote_addr  zone=api_global:10m  rate=20r/s;
    limit_req_zone  $binary_remote_addr  zone=login:10m      rate=5r/s;
    limit_req_status 429;

    # Tamaño máximo del body (registro con datos de perfil, adjuntos futuros…).
    client_max_body_size 2m;

    # ---- upstreams (DT-01: un contenedor por servicio en la red del compose) --
    # Los servicios de los sprints 2-4 se añaden aquí (evento, asistencia, …).
    upstream auth_upstream {
        server auth:3001;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}